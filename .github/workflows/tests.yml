name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        working-directory: backend
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t evidence-rag-test .

      - name: Run container and verify it serves the API and frontend
        run: |
          docker run -d --name ragtest -p 5004:5004 -e FLASK_ENV=production evidence-rag-test

          echo "Waiting for the app to boot..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5004/healthz -o /tmp/health.json; then
              echo "App responded after approx ${i}0s"
              break
            fi
            sleep 3
          done

          echo "--- container logs ---"
          docker logs ragtest
          echo "--- health check ---"
          cat /tmp/health.json

          echo "--- frontend check ---"
          curl -sf http://localhost:5004/ | grep -q "Evidence RAG"

          echo "--- API check: ingest a document and ask a question ---"
          curl -sf -X POST http://localhost:5004/api/documents \
            -H "Content-Type: application/json" \
            -d '{"text":"The sky is blue during a clear day.","source":"test.txt"}' | tee /tmp/upload.json
          grep -q "chunks_created" /tmp/upload.json

          curl -sf -X POST http://localhost:5004/api/ask \
            -H "Content-Type: application/json" \
            -d '{"question":"What color is the sky?"}' | tee /tmp/ask.json
          grep -q '"evaluation"' /tmp/ask.json

          docker stop ragtest
